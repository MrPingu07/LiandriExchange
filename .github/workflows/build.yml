name: Build LiandriExchange

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download UT2004 Installer (OldUnreal)
        id: download
        run: |
          $url = "https://github.com/OldUnreal/FullGameInstallers/releases/download/windows-game-installers/UT2004.exe"
          $output = "$env:RUNNER_TEMP\UT2004.exe"
          Write-Host "Downloading UT2004 installer..."
          Invoke-WebRequest -Uri $url -OutFile $output
          "UT2004_INSTALLER=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install UT2004 (silent)
        run: |
          $installer = $env:UT2004_INSTALLER
          $installDir = "$env:RUNNER_TEMP\UT2004"
          Write-Host "Installing UT2004 to $installDir..."
          # Silent install flags for UT2004 installer
          & $installer /S /D=$installDir
          Write-Host "Installation complete"
          "UT2004_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply OldUnreal Patch 3374
        run: |
          $url = "https://github.com/OldUnreal/UT2004Patches/releases/download/3374-rc3/OldUnreal-UT2004Patch3374-Windows-d906d39a.zip"
          $output = "$env:RUNNER_TEMP\ut2004patch.zip"
          $installDir = $env:UT2004_DIR
          Write-Host "Downloading patch 3374..."
          Invoke-WebRequest -Uri $url -OutFile "$output"
          Write-Host "Extracting patch to $installDir..."
          Expand-Archive -Path $output -DestinationPath $installDir -Force
          Write-Host "Patch applied"

      - name: Copy source to UT2004 System
        run: |
          $systemDir = "$env:UT2004_DIR\System"
          Write-Host "Copying source to $systemDir..."
          Copy-Item -Path "$env:GITHUB_WORKSPACE\Classes\*" -Destination "$systemDir\" -Recurse -Force
          Copy-Item -Path "$env:GITHUB_WORKSPACE\Resources\LiandriExchange.int" -Destination "$systemDir\" -Force
          Write-Host "Files copied successfully"

      - name: Compile with UCC
        run: |
          $systemDir = "$env:UT2004_DIR\System"
          Set-Location $systemDir
          Write-Host "Compiling with UCC in $systemDir..."
          .\UCC.exe make -package=LiandriExchange
          if (-not (Test-Path "LiandriExchange.u")) {
            Write-Error "LiandriExchange.u not found after compilation"
            exit 1
          }
          Write-Host "Compilation successful!"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiandriExchange
          path: ${{ env.UT2004_DIR }}\System\LiandriExchange.u
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.UT2004_DIR }}\System\LiandriExchange.u
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}